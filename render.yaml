services:
  - type: web
    name: ppr-trading
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRADING_MODE
        value: paper
      - key: STARTING_BALANCE
        value: 100000
      - key: MAKER_FEE
        value: 0.001
      - key: TAKER_FEE
        value: 0.001
      - key: DEFAULT_LEVERAGE
        value: 1
      - key: SLIPPAGE
        value: 0.0005
      - key: LIVE_DEGRADATION_FACTOR
        value: 0.65
      - key: WEBHOOK_SECRET
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/ppr-trading.db
    disk:
      name: app-data
      mountPath: /opt/render/project/src/data
      sizeGB: 5
